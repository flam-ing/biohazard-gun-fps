<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>GUN CONTROLLER</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      touch-action: none;
      overscroll-behavior: none;
      transition: background-color 0.05s linear;
    }

    /* 사격 시 전체 화면 빨간색 번쩍 */
    body.fire-flash {
      background: #ef4444 !important;
    }

    /* 장전 시 전체 화면 파란색 번쩍 */
    body.reload-flash {
      background: #2563eb !important;
    }

    /* 초기 1회 권한 허용 오버레이 */
    #startOverlay {
      position: fixed;
      inset: 0;
      background: #05070a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 100;
      text-align: center;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .start-btn {
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      color: #fff;
      border: none;
      border-radius: 16px;
      padding: 20px 32px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: 0 8px 30px rgba(220, 38, 38, 0.5);
      cursor: pointer;
      margin-top: 24px;
      width: 100%;
      max-width: 320px;
    }

    .guide-box {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 14px;
      padding: 16px;
      font-size: 14px;
      color: #9ca3af;
      text-align: left;
      line-height: 1.7;
      max-width: 320px;
      width: 100%;
    }

    /* 하단 미세 상태 인디케이터 (초소형) */
    #miniStatus {
      position: fixed;
      top: 14px;
      left: 16px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      font-family: monospace;
      pointer-events: none;
      letter-spacing: 1px;
      z-index: 50;
      white-space: nowrap;
    }

    /* 게임 중에도 핸드폰에서 설정/영점 열 수 있는 초소형 버튼 */
    #btnPhoneOpenSettings {
      position: fixed;
      top: 10px;
      right: 14px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #94a3b8;
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 800;
      z-index: 60;
      cursor: pointer;
    }

    /* 에임 검증 & 영점/감도 설정 전용 모바일 패널 (설정할 때만 표시) */
    #phoneTuningPanel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10, 15, 24, 0.98);
      border-top: 2px solid #22c55e;
      border-radius: 24px 24px 0 0;
      padding: 18px 18px 30px;
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 90;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.95);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      max-height: 85vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .phone-tuning-header {
      text-align: center;
      color: #38bdf8;
      font-size: 13.5px;
      font-weight: 800;
      line-height: 1.45;
    }

    /* 6가지 광범위 감도 프리셋 그리드 */
    .phone-preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .btn-phone-preset {
      background: #0f172a;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      padding: 9px 4px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
    }

    .btn-phone-preset.active {
      background: rgba(34, 197, 94, 0.18);
      border-color: #22c55e;
      color: #4ade80;
      font-weight: 900;
    }

    .phone-sens-box {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px 14px;
    }

    .btn-step-wide {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      font-size: 13px;
      font-weight: 800;
      padding: 10px 4px;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
    }

    .btn-span-step {
      background: #0f172a;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      padding: 8px 4px;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
    }

    .btn-span-step.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #38bdf8;
      font-weight: 900;
    }

    .phone-action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-phone-center-reset {
      background: rgba(56, 189, 248, 0.12);
      border: 1.5px solid #0284c7;
      color: #7dd3fc;
      border-radius: 12px;
      padding: 12px 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
    }

    .btn-phone-recalib {
      background: rgba(239, 68, 68, 0.15);
      border: 1.5px solid #ef4444;
      color: #fca5a5;
      border-radius: 12px;
      padding: 12px 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
    }

    .btn-phone-start {
      width: 100%;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 16px 14px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(34, 197, 94, 0.5);
      text-align: center;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <!-- 최초 1회 권한 허용 화면 -->
  <div id="startOverlay">
    <h1 style="font-size: 24px; color: #ef4444; margin-bottom: 14px;">🔫 건 컨트롤러 연결</h1>
    <div class="guide-box">
      • <b>화면 전체 터치</b>: 사격 (빨간색 번쩍 💥)<br/>
      • <b>핸드폰 각도 꺾기 / 스와이프</b>: 장전 (파란색 깜빡 🔄)<br/>
      • 조작 버튼 없이 <b>화면 전체가 방아쇠</b>입니다. 모니터만 보고 플레이하세요!
    </div>
    <button class="start-btn" id="btnActivate">센서 시작 (터치)</button>
  </div>

  <div id="playerSlotBadge" style="position: fixed; top: 10px; left: 14px; font-size: 12px; font-weight: 900; color: #ef4444; border: 1.5px solid #ef4444; border-radius: 999px; padding: 4px 12px; background: rgba(8, 12, 18, 0.88); z-index: 60; letter-spacing: 0.5px;">🔴 1P 연결 대기 중</div>
  <div id="miniStatus" style="display: none;">CONNECTED</div>
  <button id="btnPhoneOpenSettings">⚙️ 감도/영점</button>

  <!-- [오직 핸드폰에서만 뜨는 에임/감도/영점 설정 패널] (설정할 때만 표시) -->
  <div id="phoneTuningPanel">
    <div class="phone-tuning-header">
      🎯 핸드폰을 겨누며 아래 버튼으로 <b>감도를 맞추세요!</b>
    </div>

    <!-- 시험 사격 버튼 -->
    <button id="phoneTestPad" style="background: rgba(239, 68, 68, 0.2); border: 2px dashed #ef4444; border-radius: 12px; color: #fff; font-size: 13.5px; font-weight: 900; padding: 12px; cursor: pointer; text-align: center; box-shadow: 0 0 16px rgba(239, 68, 68, 0.4);">
      💥 여기를 탭하여 시험 사격 (벽에 탄흔 생성) 💥
    </button>

    <!-- 6가지 광범위 감도 프리셋 -->
    <div style="font-size: 11.5px; color: #94a3b8; font-weight: 800;">⚡ 원터치 감도 프리셋:</div>
    <div class="phone-preset-grid">
      <button class="btn-phone-preset" data-sens="0.35">🐌 초저감도<br/><span style="font-size: 10px; color:#4ade80;">0.35x</span></button>
      <button class="btn-phone-preset" data-sens="0.65">💻 저감도(책상)<br/><span style="font-size: 10px; color:#4ade80;">0.65x</span></button>
      <button class="btn-phone-preset active" data-sens="1.00">🖥️ 보통(1m)<br/><span style="font-size: 10px; color:#4ade80;">1.00x</span></button>
      <button class="btn-phone-preset" data-sens="1.75">⚡ 고감도<br/><span style="font-size: 10px; color:#4ade80;">1.75x</span></button>
      <button class="btn-phone-preset" data-sens="2.80">🚀 초고감도(TV)<br/><span style="font-size: 10px; color:#4ade80;">2.80x</span></button>
      <button class="btn-phone-preset" data-sens="4.50">🌪️ 익스트림<br/><span style="font-size: 10px; color:#4ade80;">4.50x</span></button>
    </div>

    <!-- 정밀 슬라이더 & 큰 단위 증감 박스 -->
    <div class="phone-sens-box" style="display: flex; flex-direction: column; gap: 8px;">
      <div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
        <div>
          <span style="font-size: 13px; color: #f8fafc; font-weight: 800;">조준 감도 배율</span>
          <span style="font-size: 10px; color: #64748b; margin-left: 4px;">(0.1x ~ 5.0x)</span>
        </div>
        <span style="font-size: 20px; font-weight: 900; color: #22c55e; font-family: monospace;" id="phoneSensVal">1.00x</span>
      </div>
      <input type="range" id="sensSlider" min="0.10" max="5.00" step="0.05" value="1.00" style="width: 100%; height: 26px; accent-color: #22c55e;" />
      <div style="width: 100%; display: flex; justify-content: space-between; gap: 6px;">
        <button class="btn-step-wide" id="btnSensMinus05">-0.5x</button>
        <button class="btn-step-wide" id="btnSensMinus01">-0.1x</button>
        <button class="btn-step-wide" id="btnSensPlus01">+0.1x</button>
        <button class="btn-step-wide" id="btnSensPlus05">+0.5x</button>
      </div>
    </div>

    <!-- 화각(화면 끝까지 닿기 위한 회전 각도) 선택 -->
    <div style="background: #020617; border: 1px solid #1e293b; border-radius: 12px; padding: 10px 12px;">
      <div style="font-size: 11.5px; color: #94a3b8; font-weight: 800; margin-bottom: 6px;">📐 손목 회전 반경 (화면 끝 도달 각도):</div>
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;">
        <button class="btn-span-step" data-span="18">좁은 각도 (±18°)<br/><span style="font-size: 9px; color:#94a3b8;">살짝만 돌려도 끝</span></button>
        <button class="btn-span-step active" data-span="28">보통 각도 (±28°)<br/><span style="font-size: 9px; color:#94a3b8;">표준 1m 거리</span></button>
        <button class="btn-span-step" data-span="42">넓은 각도 (±42°)<br/><span style="font-size: 9px; color:#94a3b8;">가까운 책상/안정</span></button>
      </div>
    </div>

    <!-- 과녁 띄우기 & 정중앙 영점 -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <button id="btnToggleTestTargets" style="background: rgba(56, 189, 248, 0.15); border: 1.5px solid #38bdf8; color: #7dd3fc; font-size: 12px; font-weight: 800; padding: 12px 6px; border-radius: 12px; cursor: pointer; text-align: center;">
        🎯 모니터 과녁 띄우기<br/><b style="color: #38bdf8;" id="targetsToggleStatus">[OFF]</b>
      </button>
      <button class="btn-phone-center-reset" id="btnPhoneCenterReset">
        🎯 지금 위치를<br/>모니터 정중앙으로
      </button>
    </div>

    <!-- 좌우 반전 & 9점 정밀 측정 -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <button id="btnPhoneInvertX" style="background: #0f172a; border: 1px solid #334155; color: #94a3b8; font-size: 12px; font-weight: 800; padding: 10px; border-radius: 10px; cursor: pointer; text-align: center;">↔️ 좌우 반전: OFF</button>
      <button class="btn-phone-recalib" id="btnPhoneRecalib" style="background: rgba(239, 68, 68, 0.12); border: 1px solid #ef4444; color: #fca5a5; font-size: 12px; font-weight: 800; padding: 10px; border-radius: 10px; cursor: pointer; text-align: center;">🔄 9점 측정 모드</button>
    </div>

    <!-- 최종 승인 & 게임 시작 버튼 -->
    <button class="btn-phone-start" id="btnPhoneConfirm">🧟 감도 확인 완료! 좀비전 시작 ➔</button>
  </div>

  <script>
    // iOS Safari 확대/스크롤 완전 차단
    document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
    document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
    document.addEventListener('gesturechange', (e) => e.preventDefault(), { passive: false });
    document.addEventListener('gestureend', (e) => e.preventDefault(), { passive: false });

    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 350 && e.cancelable) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });

    const socket = io({ transports: ['websocket', 'polling'] });
    const startOverlay = document.getElementById('startOverlay');
    const btnActivate = document.getElementById('btnActivate');
    const miniStatus = document.getElementById('miniStatus');

    let mySlot = 1;
    let myColor = '#ef4444';
    let myPlayerName = 'P1';
    let invertX = false;

    const playerSlotBadge = document.getElementById('playerSlotBadge');

    socket.on('player_assigned', (pInfo) => {
      mySlot = pInfo.slot;
      myColor = pInfo.color;
      myPlayerName = pInfo.name;
      if (playerSlotBadge) {
        playerSlotBadge.textContent = `${pInfo.label} 건 컨트롤러`;
        playerSlotBadge.style.color = pInfo.color;
        playerSlotBadge.style.borderColor = pInfo.color;
      }
    });

    // 햅틱 및 사운드
    function triggerHaptic(type) {
      if (navigator.vibrate) {
        if (type === 'shoot') navigator.vibrate(35);
        else if (type === 'reload') navigator.vibrate([40, 50, 70]);
      }
    }

    function flashColor(colorType) {
      if (colorType === 'shoot') {
        document.body.style.backgroundColor = myColor || '#ef4444';
        setTimeout(() => { document.body.style.backgroundColor = '#000000'; }, 70);
      } else if (colorType === 'reload') {
        document.body.style.backgroundColor = '#38bdf8';
        setTimeout(() => {
          document.body.style.backgroundColor = '#000000';
          setTimeout(() => {
            document.body.style.backgroundColor = '#38bdf8';
            setTimeout(() => { document.body.style.backgroundColor = '#000000'; }, 60);
          }, 70);
        }, 90);
      }
    }

    function doReload() {
      const now = Date.now();
      if (now - lastReloadTime < 550) return;
      lastReloadTime = now;
      socket.emit('reload', { method: 'gesture', slot: mySlot });
      triggerHaptic('reload');
      flashColor('reload');
    }

    // 3D 오리엔테이션 계산 (W3C Quaternion 변환 - 짐벌락 및 축 꼬임 100% 제거)
    const DEG2RAD = Math.PI / 180;
    const RAD2DEG = 180 / Math.PI;

    const _zAxis = new THREE.Vector3(0, 0, 1);
    const _xAxis = new THREE.Vector3(1, 0, 0);
    const _yAxis = new THREE.Vector3(0, 1, 0);

    let baseDir = null;

    function resetCenterOrientation() {
      baseDir = null; // 다음 프레임에서 현재 방향을 즉시 중앙 영점으로 자동 등록
    }

    socket.on('calibrate', resetCenterOrientation);

    function handleOrientation(e) {
      if (e.alpha === null || e.beta === null) return;
      const alphaRad = (e.alpha || 0) * DEG2RAD;
      const betaRad = (e.beta || 0) * DEG2RAD;
      const gammaRad = (e.gamma || 0) * DEG2RAD;

      // W3C DeviceOrientation 회전: Z(alpha) -> X'(beta) -> Y''(gamma)
      const qZ = new THREE.Quaternion().setFromAxisAngle(_zAxis, alphaRad);
      const qX = new THREE.Quaternion().setFromAxisAngle(_xAxis, betaRad);
      const qY = new THREE.Quaternion().setFromAxisAngle(_yAxis, gammaRad);
      const qDevice = qZ.multiply(qX).multiply(qY);

      // 스마트폰 상단(+Y축, 총구 방향)이 가리키는 3D 벡터
      const currentDir = new THREE.Vector3(0, 1, 0).applyQuaternion(qDevice);

      if (!baseDir) {
        baseDir = currentDir.clone();
      }

      // 수평 회전(Yaw): X-Y 평면 상의 방위각 차이 (정방향: 우측 회전 시 양수)
      const currentHeading = Math.atan2(currentDir.x, currentDir.y);
      const baseHeading = Math.atan2(baseDir.x, baseDir.y);
      let dYawDeg = (currentHeading - baseHeading) * RAD2DEG;
      if (invertX) dYawDeg = -dYawDeg;
      dYawDeg = ((dYawDeg + 540) % 360) - 180;

      // 수직 고도(Pitch): Z축(높이) 투영 각도 차이
      const currentElev = Math.asin(Math.max(-1, Math.min(1, currentDir.z)));
      const baseElev = Math.asin(Math.max(-1, Math.min(1, baseDir.z)));
      const dPitchDeg = (currentElev - baseElev) * RAD2DEG;

      currentYaw = dYawDeg;
      currentPitch = dPitchDeg;
      currentRoll = e.gamma || 0;

      socket.emit('aim', {
        slot: mySlot,
        yaw: currentYaw,
        pitch: currentPitch,
        roll: currentRoll
      });
    }

    // 모션 장전 감지 (핸드폰 각도 확 꺾기)
    function handleMotion(e) {
      const rot = e.rotationRate;
      if (rot) {
        const a = Math.abs(rot.alpha || 0);
        const b = Math.abs(rot.beta || 0);
        const g = Math.abs(rot.gamma || 0);
        if (a > 260 || b > 260 || g > 300) {
          doReload();
        }
      }
      const acc = e.acceleration;
      if (acc) {
        const total = Math.abs(acc.x || 0) + Math.abs(acc.y || 0) + Math.abs(acc.z || 0);
        if (total > 26) {
          doReload();
        }
      }
    }

    btnActivate.addEventListener('click', async () => {
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          const s = await DeviceOrientationEvent.requestPermission();
          if (s === 'granted') window.addEventListener('deviceorientation', handleOrientation, true);
        } else {
          window.addEventListener('deviceorientation', handleOrientation, true);
        }

        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          const m = await DeviceMotionEvent.requestPermission();
          if (m === 'granted') window.addEventListener('devicemotion', handleMotion, true);
        } else {
          window.addEventListener('devicemotion', handleMotion, true);
        }
      } catch (err) {
        console.warn(err);
      }

      startOverlay.style.display = 'none';
      socket.emit('register_role', 'controller');
      miniStatus.textContent = 'GUN ARMED • TOUCH TO FIRE';
    });

    // 에임 검증 & 시작 승인 패널 컨트롤
    const phoneTuningPanel = document.getElementById('phoneTuningPanel');
    const btnPhoneConfirm = document.getElementById('btnPhoneConfirm');
    const btnPhoneRecalib = document.getElementById('btnPhoneRecalib');
    const btnPhoneCenterReset = document.getElementById('btnPhoneCenterReset');
    const phoneSensVal = document.getElementById('phoneSensVal');
    const sensSlider = document.getElementById('sensSlider');
    const btnSensMinus05 = document.getElementById('btnSensMinus05');
    const btnSensMinus01 = document.getElementById('btnSensMinus01');
    const btnSensPlus01 = document.getElementById('btnSensPlus01');
    const btnSensPlus05 = document.getElementById('btnSensPlus05');
    const btnPhoneOpenSettings = document.getElementById('btnPhoneOpenSettings');
    const btnToggleTestTargets = document.getElementById('btnToggleTestTargets');
    const targetsToggleStatus = document.getElementById('targetsToggleStatus');

    let currentPhoneSens = 1.0;
    let testTargetsActive = false;

    function applySensUpdate(val) {
      currentPhoneSens = Math.max(0.1, Math.min(5.0, +val.toFixed(2)));
      phoneSensVal.textContent = `${currentPhoneSens.toFixed(2)}x`;
      if (sensSlider) sensSlider.value = currentPhoneSens;
      socket.emit('adjust_sens', { sens: currentPhoneSens, slot: mySlot });
      triggerHaptic('shoot');
    }

    if (sensSlider) {
      sensSlider.addEventListener('input', (e) => {
        e.stopPropagation();
        applySensUpdate(parseFloat(e.target.value));
      });
    }

    if (btnSensMinus05) btnSensMinus05.addEventListener('click', (e) => { e.stopPropagation(); applySensUpdate(currentPhoneSens - 0.5); });
    if (btnSensMinus01) btnSensMinus01.addEventListener('click', (e) => { e.stopPropagation(); applySensUpdate(currentPhoneSens - 0.1); });
    if (btnSensPlus01) btnSensPlus01.addEventListener('click', (e) => { e.stopPropagation(); applySensUpdate(currentPhoneSens + 0.1); });
    if (btnSensPlus05) btnSensPlus05.addEventListener('click', (e) => { e.stopPropagation(); applySensUpdate(currentPhoneSens + 0.5); });

    // 6가지 프리셋 버튼 탭
    document.querySelectorAll('.phone-preset-grid .btn-phone-preset').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const s = parseFloat(btn.getAttribute('data-sens'));
        document.querySelectorAll('.phone-preset-grid .btn-phone-preset').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        applySensUpdate(s);
      });
    });

    // 손목 회전 각도 폭 버튼 탭
    document.querySelectorAll('.btn-span-step').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const span = parseInt(btn.getAttribute('data-span'), 10);
        document.querySelectorAll('.btn-span-step').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        socket.emit('set_angle_span', { span, slot: mySlot });
        triggerHaptic('reload');
      });
    });

    // 모니터 과녁 띄우기 토글
    if (btnToggleTestTargets) {
      btnToggleTestTargets.addEventListener('click', (e) => {
        e.stopPropagation();
        testTargetsActive = !testTargetsActive;
        targetsToggleStatus.textContent = testTargetsActive ? '[ON]' : '[OFF]';
        targetsToggleStatus.style.color = testTargetsActive ? '#22c55e' : '#38bdf8';
        btnToggleTestTargets.style.borderColor = testTargetsActive ? '#22c55e' : '#38bdf8';
        socket.emit('toggle_test_targets', { enabled: testTargetsActive, slot: mySlot });
        triggerHaptic('shoot');
      });
    }

    // 핸드폰 상단 [⚙️ 감도/영점] 버튼으로 언제든 열기
    btnPhoneOpenSettings.addEventListener('click', (e) => {
      e.stopPropagation();
      phoneTuningPanel.style.display = 'flex';
      miniStatus.textContent = '⚙️ 에임/영점 설정 중';
      socket.emit('tuning_mode_start', { slot: mySlot, sens: currentPhoneSens });
      triggerHaptic('reload');
    });

    // 좌우 반전 토글
    const btnPhoneInvertX = document.getElementById('btnPhoneInvertX');
    if (btnPhoneInvertX) {
      btnPhoneInvertX.addEventListener('click', (e) => {
        e.stopPropagation();
        invertX = !invertX;
        btnPhoneInvertX.textContent = invertX ? '↔️ 좌우 반전: ON' : '↔️ 좌우 반전: OFF';
        btnPhoneInvertX.style.borderColor = invertX ? '#38bdf8' : '#334155';
        btnPhoneInvertX.style.color = invertX ? '#38bdf8' : '#94a3b8';
        triggerHaptic('shoot');
      });
    }

    socket.on('tuning_mode_start', (data) => {
      phoneTuningPanel.style.display = 'flex';
      miniStatus.textContent = '🎯 에임 체험 모드 (아래에서 [시작] 터치)';
      if (data && data.sens) {
        currentPhoneSens = data.sens;
        phoneSensVal.textContent = `${currentPhoneSens.toFixed(2)}x`;
        if (sensSlider) sensSlider.value = currentPhoneSens;
      }
      triggerHaptic('reload');
    });

    socket.on('game_started', () => {
      phoneTuningPanel.style.display = 'none';
      miniStatus.textContent = '🧟 전투 진행 중 • 화면 터치 = 사격';
      triggerHaptic('shoot');
    });

    socket.on('sync_sens', (data) => {
      if (data && typeof data.sens === 'number') {
        currentPhoneSens = data.sens;
        phoneSensVal.textContent = `${currentPhoneSens.toFixed(2)}x`;
        if (sensSlider) sensSlider.value = currentPhoneSens;
      }
    });

    // 지금 겨눈 곳을 정중앙으로 (Center Reset)
    btnPhoneCenterReset.addEventListener('click', (e) => {
      e.stopPropagation();
      socket.emit('request_center_reset', { slot: mySlot });
      triggerHaptic('reload');
    });

    // 9점 정밀 측정 모드 요청
    btnPhoneRecalib.addEventListener('click', (e) => {
      e.stopPropagation();
      socket.emit('request_recalib', { slot: mySlot });
      phoneTuningPanel.style.display = 'none';
      miniStatus.textContent = '🎯 9점 영점 맞추기 진행 중';
      triggerHaptic('reload');
    });

    // 시험 사격 패드 터치 시 발사
    const phoneTestPad = document.getElementById('phoneTestPad');
    if (phoneTestPad) {
      phoneTestPad.addEventListener('click', (e) => {
        e.stopPropagation();
        socket.emit('shoot', { slot: mySlot, timestamp: Date.now(), yaw: currentYaw, pitch: currentPitch });
        triggerHaptic('shoot');
        flashColor('shoot');
      });
    }

    // 감도 완료! 좀비전 시작 (오직 핸드폰에서만 누름!)
    btnPhoneConfirm.addEventListener('click', (e) => {
      e.stopPropagation();
      socket.emit('confirm_start_game', { slot: mySlot });
      phoneTuningPanel.style.display = 'none';
      miniStatus.textContent = '🧟 전투 시작! 화면 터치 = 사격';
      triggerHaptic('shoot');
    });

    // 화면 터치 사격 (터치 시 빨간색 깜빡) & 스와이프 장전
    let touchStartY = 0;
    let touchStartX = 0;

    window.addEventListener('touchstart', (e) => {
      if (startOverlay.style.display !== 'none') return;
      if (e.target.closest('#phoneTuningPanel')) return; // 패널 조작 시 사격 방지
      if (e.cancelable) e.preventDefault();

      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;

      // 즉시 사격 발사 & 플레이어 고유 색상 번쩍!
      socket.emit('shoot', {
        slot: mySlot,
        timestamp: Date.now(),
        yaw: currentYaw,
        pitch: currentPitch,
        roll: currentRoll
      });

      triggerHaptic('shoot');
      flashColor('shoot');
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (startOverlay.style.display !== 'none') return;
      if (e.target.closest('#phoneTuningPanel')) return;
      if (e.cancelable) e.preventDefault();
      const t = e.touches[0];
      const dy = t.clientY - touchStartY;
      const dx = t.clientX - touchStartX;

      // 화면을 길게 쓸어내리거나 올리면 스와이프 장전!
      if (Math.abs(dy) > 70 || Math.abs(dx) > 70) {
        doReload();
        touchStartY = t.clientY;
        touchStartX = t.clientX;
      }
    }, { passive: false });
  </script>
</body>
</html>
